name: Build ArtCraft workspace
on:
  push:
    branches: [main]
    paths: ['workspaces/artcraft/**', '.github/workflows/build-artcraft.yml']
  workflow_dispatch:
  schedule:
    - cron: '20 12 * * *'
permissions:
  contents: read
  packages: write
concurrency:
  group: artcraft-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Generate lowercase image name and unique version
        id: meta
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/artcraft-workspace" >> "$GITHUB_OUTPUT"
          echo "version=$(date -u +%Y.%m.%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./workspaces/artcraft
          platforms: linux/amd64
          push: true
          pull: true
          build-args: |
            ARTCRAFT_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ${{ steps.meta.outputs.image }}:daily
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report image
        run: |
          echo 'Published: `${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}`' >> "$GITHUB_STEP_SUMMARY"
          echo 'Daily tag: `${{ steps.meta.outputs.image }}:daily`' >> "$GITHUB_STEP_SUMMARY"
